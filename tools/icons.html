<!doctype html><meta charset="utf-8"><body style="background:#222;color:#fff;font-family:sans-serif">
<p id="s">rendering…</p>
<script>
// Renders assets/img/logo.svg to the PNG icons and saves them through tools/serve.cjs (dev only).
(async () => {
  const img = new Image(); img.src = '../assets/img/logo.svg';
  await img.decode();
  for (const n of [180, 192, 512]) {
    const c = document.createElement('canvas'); c.width = c.height = n;
    c.getContext('2d').drawImage(img, 0, 0, n, n);
    const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
    await fetch('/__save/icon-' + n + '.png', { method: 'PUT', body: blob });
    document.body.appendChild(c);
  }
  document.getElementById('s').textContent = 'saved';
})();
</script>
